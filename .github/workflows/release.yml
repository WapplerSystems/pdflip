name: Release

# Publishes a tag vX.Y.Z to npm and creates the GitHub release.
#
# npm uses Trusted Publishing (OIDC): no token is stored. The package settings on
# npmjs.com list this repository and this workflow file (release.yml) as trusted
# publisher; npm then also attaches a provenance statement to every version.

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Tag matches package.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          test "v$VERSION" = "$GITHUB_REF_NAME" || { echo "::error::tag $GITHUB_REF_NAME, package.json $VERSION"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - name: Publish to npm
        run: |
          NAME=$(node -p "require('./package.json').name")
          # Trusted Publishing needs npm ≥ 11.5.1
          npm install -g npm@latest
          if ! npm view "$NAME" name >/dev/null 2>&1; then
            # npm only allows a trusted publisher for packages that already exist,
            # so the very first version has to be published by hand
            echo "::warning::$NAME does not exist on npm yet; publish the first version by hand, then add the trusted publisher."
          elif npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already on npm, skipping."
          else
            npm publish --access public
          fi
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # release notes: the section of this version in CHANGELOG.md
          awk -v v="$VERSION" '/^## /{p = index($0, v) > 0; next} p' CHANGELOG.md > notes.md
          # the npm tarball, installable with `npm install <url>` independently of the registry
          npm pack --silent
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "pdflip $VERSION" --notes-file notes.md "wapplersystems-pdflip-$VERSION.tgz"
